  <path d="M17.5 16.4
           C20.5 16.4 22.5 17.7 22.5 20
           C22.5 22.3 21 24.3 17.8 24.3
           C15.3 24.3 14 23 14 21.2"
        stroke="#f7d54a" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- eye -->
  <circle cx="11" cy="11.2" r="1.3" fill="#0f172a"/>
</svg>
