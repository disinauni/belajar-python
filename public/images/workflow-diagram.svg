<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <style>
      :root {
        --bg: #f8fafc;
        --border: #e2e8f0;
        --label: #64748b;
        --arrow: #94a3b8;
        --loop: #cbd5e1;
        --loop-text: #94a3b8;
        --dt-text: #1c1917;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --border: #1e293b;
          --label: #475569;
          --arrow: #475569;
          --loop: #334155;
          --loop-text: #475569;
          --dt-text: #0f172a;
        }
      }
    </style>
    <filter id="wf-sh">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.10)"/>
    </filter>
    <marker id="wf-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--arrow)"/>
    </marker>
    <marker id="wf-al" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--loop)"/>
    </marker>
    <marker id="wf-ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <linearGradient id="wf-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="wf-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="wf-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="560" height="300" rx="14" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>

  <!-- ══════════════ ROW 1 (y-center=80) ══════════════ -->

  <!-- [Tulis Kode] x=16 y=58 w=112 h=44 -->
  <g filter="url(#wf-sh)">
    <rect x="16" y="58" width="112" height="44" rx="10" fill="url(#wf-blue)"/>
  </g>
  <text x="72" y="77" text-anchor="middle" fill="white" font-size="12" font-weight="700">Tulis</text>
  <text x="72" y="92" text-anchor="middle" fill="white" font-size="12" font-weight="700">Kode</text>

  <!-- → Jalankan -->
  <line x1="128" y1="80" x2="158" y2="80" stroke="var(--arrow)" stroke-width="2" marker-end="url(#wf-a)"/>

  <!-- [Jalankan] x=158 y=58 w=108 h=44 -->
  <g filter="url(#wf-sh)">
    <rect x="158" y="58" width="108" height="44" rx="10" fill="url(#wf-blue)"/>
  </g>
  <text x="212" y="85" text-anchor="middle" fill="white" font-size="13" font-weight="700">Jalankan</text>

  <!-- → Ada Error? -->
  <line x1="266" y1="80" x2="290" y2="80" stroke="var(--arrow)" stroke-width="2" marker-end="url(#wf-a)"/>

  <!-- ◇ Ada Error? center=(348,80) hw=58 hh=28 -->
  <polygon points="290,80 348,52 406,80 348,108" fill="#f59e0b"/>
  <text x="348" y="76" text-anchor="middle" fill="var(--dt-text)" font-size="11" font-weight="700">Ada</text>
  <text x="348" y="89" text-anchor="middle" fill="var(--dt-text)" font-size="11" font-weight="700">Error?</text>

  <!-- Ya label + → Perbaiki -->
  <text x="417" y="76" fill="#dc2626" font-size="11" font-weight="700">Ya</text>
  <line x1="406" y1="80" x2="434" y2="80" stroke="var(--arrow)" stroke-width="2" marker-end="url(#wf-a)"/>

  <!-- [Perbaiki] x=434 y=58 w=110 h=44 -->
  <g filter="url(#wf-sh)">
    <rect x="434" y="58" width="110" height="44" rx="10" fill="url(#wf-red)"/>
  </g>
  <text x="489" y="85" text-anchor="middle" fill="white" font-size="13" font-weight="700">Perbaiki</text>

  <!-- Perbaiki → Jalankan dashed loop (via y=34) -->
  <path d="M489,58 L489,34 L212,34 L212,58"
        fill="none" stroke="var(--loop)" stroke-width="1.5" stroke-dasharray="5,3"
        marker-end="url(#wf-al)"/>
  <text x="350" y="26" text-anchor="middle" fill="var(--loop-text)" font-size="10">jalankan ulang</text>

  <!-- Tidak label + path ↓ to ◇Output sesuai? -->
  <text x="355" y="126" fill="#059669" font-size="11" font-weight="700">Tidak</text>
  <path d="M348,108 L348,165 L210,165 L210,185"
        fill="none" stroke="var(--arrow)" stroke-width="2" marker-end="url(#wf-a)"/>

  <!-- ══════════════ ROW 2 (y-center=210) ══════════════ -->

  <!-- ◇ Output sesuai? center=(210,210) hw=64 hh=28 -->
  <polygon points="146,210 210,182 274,210 210,238" fill="#f59e0b"/>
  <text x="210" y="206" text-anchor="middle" fill="var(--dt-text)" font-size="10" font-weight="700">Output</text>
  <text x="210" y="218" text-anchor="middle" fill="var(--dt-text)" font-size="10" font-weight="700">sesuai?</text>

  <!-- Tidak label + → Perbaiki kode -->
  <text x="284" y="206" fill="#dc2626" font-size="11" font-weight="700">Tidak</text>
  <line x1="274" y1="210" x2="330" y2="210" stroke="var(--arrow)" stroke-width="2" marker-end="url(#wf-a)"/>

  <!-- [Perbaiki kode] x=330 y=188 w=118 h=44 -->
  <g filter="url(#wf-sh)">
    <rect x="330" y="188" width="118" height="44" rx="10" fill="url(#wf-red)"/>
  </g>
  <text x="389" y="207" text-anchor="middle" fill="white" font-size="12" font-weight="700">Perbaiki</text>
  <text x="389" y="221" text-anchor="middle" fill="white" font-size="12" font-weight="700">Kode</text>

  <!-- Perbaiki kode → Tulis Kode big loop (left side) -->
  <path d="M389,232 L389,266 L8,266 L8,80 L16,80"
        fill="none" stroke="var(--loop)" stroke-width="1.5" stroke-dasharray="5,3"
        marker-end="url(#wf-al)"/>
  <text x="198" y="281" text-anchor="middle" fill="var(--loop-text)" font-size="10">mulai dari Tulis Kode</text>

  <!-- Ya label + ↓ arrow → Selesai -->
  <text x="216" y="254" fill="#059669" font-size="11" font-weight="700">Ya</text>
  <line x1="210" y1="238" x2="210" y2="257" stroke="#10b981" stroke-width="2" marker-end="url(#wf-ag)"/>

  <!-- [Selesai!] pill -->
  <g filter="url(#wf-sh)">
    <rect x="145" y="257" width="130" height="36" rx="18" fill="url(#wf-green)"/>
  </g>
  <text x="210" y="272" text-anchor="middle" fill="white" font-size="13" font-weight="700">Selesai!</text>
  <text x="210" y="285" text-anchor="middle" fill="rgba(255,255,255,0.78)" font-size="10">program berjalan</text>
</svg>
